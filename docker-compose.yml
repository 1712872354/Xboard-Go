version: '3.8'

services:
  xboard-go:
    image: ghcr.io/1712872354/xboard-go:latest
    container_name: xboard-go
    restart: always
    ports:
      - "8080:8080"   # HTTP API + Frontend
      - "50051:50051" # gRPC for nodes
    volumes:
      - ./data:/data
    environment:
      - XBOARD_SERVER_PORT=8080
      - XBOARD_DATABASE_DRIVER=sqlite
      - XBOARD_DATABASE_SOURCE=/data/xboard.db
      # Uncomment to use MySQL:
      # - XBOARD_DATABASE_DRIVER=mysql
      # - XBOARD_DATABASE_SOURCE=user:password@tcp(localhost:3306)/xboard?charset=utf8mb4&parseTime=True&loc=Local
      # Uncomment to use Redis:
      # - XBOARD_REDIS_ADDR=localhost:6379
      # - XBOARD_REDIS_PASSWORD=
      # - XBOARD_REDIS_DB=0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
