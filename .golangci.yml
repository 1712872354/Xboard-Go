run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # 默认启用的 linter
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # 额外启用的 linter
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - exportloopref
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: true

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  goconst:
    min-len: 2
    min-occurrences: 3

  gocyclo:
    min-complexity: 15

  gofmt:
    simplify: true

  goimports:
    local-prefixes: xboard-go

  gosec:
    excludes:
      - G104  # 未处理的错误（某些场景下合理）

  misspell:
    locale: US

  nakedret:
    max-func-lines: 20

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code

issues:
  exclude-rules:
    # 测试文件可以更宽松
    - path: _test\.go
      linters:
        - gocritic
        - gosec
        - errcheck

    # 生成的文件
    - path: \.gen\.go$
      linters:
        - all

    # 嵌入的静态文件
    - path: internal/static/
      linters:
        - gofmt
        - goimports

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    - format: colored-line-number
  sort-results: true
  sort-order:
    - file
